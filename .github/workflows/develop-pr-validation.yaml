name: develop-pr-validation
on:
  pull_request:
    branches:
      - develop
jobs:
  pr-validation-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Lint HTML and CSS
        run: |
          npx htmlhint "**/*.html"
          npx stylelint "**/*.css"
      - name: Build With Parcel
        run: |
          npx parcel build "./src/index.html" --dist-dir "./dist-dev" --public-url "./"
        