name: wf-develop-deploy
on:
  push:
    branches:
      - "release/**"
jobs:
  build-production-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: build with Parcel
        run: |
          npx parcel build "./src/idnex.html" --dist-dir "./dist-staging" --public-url "./"
      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          name: "staging-artifact"
          path: "./dist-staging"

  deploy-production-job:
    needs: "build-production-job"
    environment: "staging-env"
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: deploy on staging environment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: "staging-artifact"
          token: ${{github.token}}