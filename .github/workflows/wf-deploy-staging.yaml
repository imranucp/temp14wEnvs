name: wf-staging-deploy
on:
  push:
    branches:
      - "release/**"
jobs:
  build-staging-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: build with Parcel
        run: |
          npx parcel build "./src/index.html" --dist-dir "./dist-staging" --public-url "./"
      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          name: "staging-artifact"
          path: "./dist-staging"

  deploy-staging-job:
    needs: "build-staging-job"
    environment: "staging-env"
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: deploy on staging environment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: "staging-artifact"
          token: ${{github.token}}